<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Sound</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="bg-wallpaper" id="bg-wallpaper"></div>
    <div class="bg-glow" id="bg-glow-layer"></div>

    <div class="app-container">
        
        <!-- БОКОВАЯ ПАНЕЛЬ -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">
                    <i data-lucide="music" style="color: #ff2a74;"></i>
                    <span>Vibe Sound</span>
                </div>
                <button class="collapse-btn"><i data-lucide="sidebar"></i></button>
            </div>

            <nav class="menu" style="margin-top: 25px;">
                <div id="menu-main" class="menu-item active">
                    <i data-lucide="home"></i>
                    <span>Главная</span>
                </div>
                <div id="menu-wave" class="menu-item">
                    <i data-lucide="waves" style="color: #ff2a74;"></i>
                    <span>Моя Волна</span>
                </div>
                <div id="menu-favorites" class="menu-item">
                    <i data-lucide="heart"></i>
                    <span>Любимое</span>
                </div>
                <div id="menu-wallpaper" class="menu-item">
                    <i data-lucide="image"></i>
                    <span>Обои</span>
                </div>
                <div id="menu-playlists" class="menu-item">
                    <i data-lucide="music-4"></i>
                    <span>Плейлисты</span>
                </div>
                <div id="menu-stats" class="menu-item">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Статистика</span>
                </div>
                <div class="menu-item" id="menu-settings">
                    <i data-lucide="sliders"></i>
                    <span>Настройки</span>
                </div>
            </nav>
        </aside>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="page-title">Главная</h1>
            </header>

            <!-- ВКЛАДКА: ГЛАВНАЯ -->
            <section id="tab-main" class="tab-content active">
                <div class="player-card">
                    <div class="player-cover" id="cover-parent">
                        <img id="cover" src="" alt="">
                    </div>
                    <div class="player-info">
                        <h2 id="title">Нет треков</h2>
                        <p id="artist">Загрузите музыку во вкладке Любимое</p>
                    </div>
                </div>
            </section>

            <!-- ВКЛАДКА: МОЯ ВОЛНА -->
            <section id="tab-wave" class="tab-content" style="display: none; padding: 20px 40px; height: calc(88vh - 180px);">
                <!-- Наполнение генерируется через vibe-wave-map.js -->
            </section>

            <!-- ВКЛАДКА: ЛЮБИМОЕ (МЕДИАТЕКА) -->
            <section id="tab-favorites" class="tab-content">
                <div class="playlist-container">
                    <div class="playlist-top-bar">
                        <div class="playlist-header-text">Ваша медиатека</div>
                        <div style="display: flex; gap: 8px;">
                            <button class="upload-action-btn" onclick="document.getElementById('local-cover-input').click()">
                                <i data-lucide="image"></i> Обложка к треку
                            </button>
                            <button class="upload-action-btn" onclick="document.getElementById('local-audio-input').click()">
                                <i data-lucide="plus"></i> Песня
                            </button>
                        </div>
                        <input type="file" id="local-audio-input" accept="audio/mp3,audio/*" style="display: none;">
                        <input type="file" id="local-cover-input" accept="image/*" style="display: none;">
                    </div>
                    <div class="tracks-list" id="favorites-list"></div>
                </div>
            </section>

            <!-- ВКЛАДКА: ОБОИ -->
            <section id="tab-wallpaper" class="tab-content">
                <div class="wallpaper-container">
                    <div class="playlist-top-bar">
                        <div class="playlist-header-text">Фоновое оформление</div>
                        <button class="upload-action-btn" onclick="document.getElementById('local-bg-input').click()">
                            <i data-lucide="upload"></i> Свои обои (GIF/Фото)
                        </button>
                        <input type="file" id="local-bg-input" accept="image/*" style="display: none;">
                    </div>
                    <div class="wallpaper-grid" id="wallpaper-grid"></div>
                </div>
            </section>

            <!-- ВКЛАДКА: ПЛЕЙЛИСТЫ -->
            <section id="tab-playlists" class="tab-content" style="display: none;">
                <!-- Наполнение генерируется через vibe-playlists.js -->
            </section>

            <!-- ВКЛАДКА: СТАТИСТИКА -->
            <section id="tab-stats" class="tab-content" style="display: none;">
                <!-- Наполнение генерируется через stats.js -->
            </section>

            <!-- ВКЛАДКА: НАСТРОЙКИ -->
            <section id="tab-settings" class="tab-content" style="display: none;">
                <!-- Наполнение генерируется через vibe-settings.js -->
            </section>

            <audio id="audio"></audio>

            <!-- ПАНЕЛЬ УПРАВЛЕНИЯ ПЛЕЕРОМ -->
            <footer class="player-controls-bar">
                <div class="timeline-container">
                    <span id="current-time" class="time-label">0:00</span>
                    <div class="slider-wrapper">
                        <input type="range" id="progress" class="progress-slider" value="0" max="100">
                    </div>
                    <span id="duration" class="time-label">0:00</span>
                </div>

                <div class="controls-buttons">
                    <button class="ctrl-btn" id="prev"><i data-lucide="skip-back"></i></button>
                    <button class="play-pause-btn" id="play">
                        <i data-lucide="play" id="play-icon"></i>
                    </button>
                    <button class="ctrl-btn" id="next"><i data-lucide="skip-forward"></i></button>
                </div>
            </footer>
        </main>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if(window.lucide) lucide.createIcons();
        });
    </script>
    
    <!-- ИСПРАВЛЕНО: База данных теперь грузится СТРОГО ПЕРВОЙ, открывая доступ к музыке -->
    <script src="database.js"></script>
    <script src="context-menu.js"></script>
    <script src="script.js"></script>
</body>
</html>
